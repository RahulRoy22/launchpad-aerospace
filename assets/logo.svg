<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="rocketGrad" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(6, 6)">
    <!-- Orbital Rings -->
    <ellipse cx="26" cy="26" rx="22" ry="9" stroke="url(#orbitGrad)" stroke-width="1.75" transform="rotate(-30 26 26)" stroke-dasharray="2 2" opacity="0.7"/>
    <ellipse cx="26" cy="26" rx="24" ry="11" stroke="url(#orbitGrad)" stroke-width="2" transform="rotate(-30 26 26)"/>
    <!-- Stylized Rocket / Chevron Launch Mark -->
    <path d="M26 10L36 32L26 28L16 32L26 10Z" fill="url(#rocketGrad)" filter="url(#glow)"/>
    <!-- Core propulsion dot -->
    <circle cx="26" cy="35" r="2.5" fill="#38BDF8" filter="url(#glow)"/>
  </g>
  <!-- Wordmark -->
  <text x="70" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Launch<tspan fill="#C084FC">Pad</tspan></text>
  <text x="188" y="24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8" letter-spacing="1">OS.2</text>
</svg>